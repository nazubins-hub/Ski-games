<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fore-aft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --snow:#F3F7FA; --snow-shade:#D9E3EC; --ink:#17243A; --ink-soft:#5A6880;
  --panel:#FFFFFF; --line:#C9D5E1; --good:#2B8A5E; --warn:#D08F00; --bad:#D22B40; --cool:#1E5BCC;
  --sky:#E3EDF6; --ridge:#C9D7E4; --ground:#FFFFFF; --ground-shade:#DCE6EF;
  --tree:#2E5A45; --tree-hi:#477A5F; --jacket:#C2410C;
  --scrim:rgba(243,247,250,.92);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --snow:#0E1828; --snow-shade:#1A2940; --ink:#E5EDF6; --ink-soft:#93A3BA;
    --panel:#13213A; --line:#2A3C58; --good:#3FBF86; --warn:#F1B42F; --bad:#FF5C70; --cool:#5D8DFF;
    --sky:#0E1828; --ridge:#1C2B43; --ground:#2A3B57; --ground-shade:#1F2E47;
    --tree:#24493A; --tree-hi:#356A52; --jacket:#FB923C;
    --scrim:rgba(14,24,40,.9);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --snow:#0E1828; --snow-shade:#1A2940; --ink:#E5EDF6; --ink-soft:#93A3BA;
  --panel:#13213A; --line:#2A3C58; --good:#3FBF86; --warn:#F1B42F; --bad:#FF5C70; --cool:#5D8DFF;
  --sky:#0E1828; --ridge:#1C2B43; --ground:#2A3B57; --ground-shade:#1F2E47;
  --tree:#24493A; --tree-hi:#356A52; --jacket:#FB923C;
  --scrim:rgba(14,24,40,.9);
  color-scheme: dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);}
body{height:100%;margin:0;background:var(--snow);color:var(--ink);font-family:Barlow,"Helvetica Neue",Arial,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
.app{position:relative;height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column}
.hud{display:grid;grid-template-columns:auto auto auto 1fr auto;gap:16px;align-items:end;padding:10px 16px 8px}
.pause{align-self:center;width:36px;height:36px;padding:0;display:grid;place-items:center;border-radius:8px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.pause:focus-visible{outline:3px solid var(--ink-soft);outline-offset:1px}
.stat .k,.k{display:block;font-size:12px;color:var(--ink-soft);letter-spacing:.02em}
.stat .v{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.balance .bar{height:10px;border-radius:5px;background:var(--snow-shade);overflow:hidden;margin-top:6px}
.balance .bar i{display:block;height:100%;width:100%;background:var(--good);transition:background-color .2s}
.stage{position:relative;flex:1;min-height:0}
#slope{position:absolute;inset:0;width:100%;height:100%;display:block}
.overlay{position:absolute;inset:0;z-index:2;display:flex;padding:20px;background:var(--scrim);overflow-y:auto}
.overlay[hidden]{display:none}
.card{max-width:360px;margin:auto}
.back{display:inline-block;margin:0 0 10px;padding:6px 0;font:600 14px Barlow,sans-serif;color:var(--ink-soft);text-decoration:none}
.back:hover,.back:focus-visible{color:var(--ink);text-decoration:underline}
.card h1,.card h2{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;margin:0 0 6px;line-height:.95}
.card h1{font-size:56px;letter-spacing:-.01em}
.card h2{font-size:40px}
.card p{margin:0 0 12px;line-height:1.45;font-size:16px}
.card .src{font-size:13px;color:var(--ink-soft);border-left:3px solid var(--jacket);padding-left:10px}
.cause{font-size:19px!important;font-weight:600}
.chips{display:flex;gap:8px;margin:14px 0 6px}
.chip{flex:1;font:600 15px Barlow,sans-serif;padding:10px 0;border-radius:8px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.chip .dot{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:0}
.dot.green{background:#2B8A5E;border-radius:50%}.dot.blue{background:#1E5BCC}.dot.black{background:var(--ink);transform:rotate(45deg) scale(.85)}
.best{font-size:13px;color:var(--ink-soft);min-height:18px;margin-bottom:14px}
.btn{display:block;width:100%;font:700 22px "Barlow Condensed",sans-serif;padding:12px;border-radius:10px;border:0;background:var(--ink);color:var(--snow);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);font:600 15px Barlow,sans-serif;padding:10px;margin-top:6px}
.statsline{display:flex;gap:18px;margin:4px 0 16px}
.statsline div{font-size:12px;color:var(--ink-soft)}
.statsline b{display:block;font:700 26px "Barlow Condensed",sans-serif;color:var(--ink)}
.controls{padding:8px 16px 14px;border-top:1px solid var(--line);background:var(--panel)}
.meter-row{display:grid;grid-template-columns:auto 1fr 96px;gap:10px;align-items:center}
.meter{position:relative;height:12px;border-radius:6px;overflow:hidden;opacity:.9;
  background:linear-gradient(to right,var(--bad) 0 var(--a1),var(--warn) var(--a1) var(--a2),var(--good) var(--a2) var(--a3),var(--warn) var(--a3) var(--a4),var(--bad) var(--a4) 100%)}
.meter i{position:absolute;top:-2px;bottom:-2px;width:4px;margin-left:-2px;background:var(--ink);border-radius:2px;left:50%}
.meter-ends{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-soft);margin:2px 106px 0 calc(10px + 4.6em)}
#meterWord{font:700 18px "Barlow Condensed",sans-serif;text-align:right}
#trace{display:block;width:100%;height:56px;margin:8px 0 6px}
.slider{position:relative;height:56px;touch-action:none;cursor:grab;outline:none;border-radius:12px}
.slider:focus-visible{box-shadow:0 0 0 3px var(--cool)}
.slider.active{cursor:grabbing}
.track{position:absolute;left:22px;right:22px;top:50%;height:8px;margin-top:-4px;border-radius:4px;background:var(--snow-shade)}
.track .notch{position:absolute;left:50%;top:-8px;bottom:-8px;width:2px;margin-left:-1px;background:var(--ink-soft)}
.track .tick{position:absolute;top:-4px;bottom:-4px;width:1px;background:var(--line)}
.fill{position:absolute;top:0;bottom:0;border-radius:4px;background:var(--ink-soft)}
.thumb{position:absolute;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:var(--panel);border:3px solid var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.18)}
.thumb::after{content:"";position:absolute;left:50%;top:9px;bottom:9px;width:3px;margin-left:-1.5px;border-radius:2px;background:var(--ink)}
.slider-labels{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-soft);padding:0 4px}
#hipVal{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion: reduce){.balance .bar i{transition:none}}
</style>
</head>
<body>
<main class="app">
  <header class="hud">
    <div class="stat"><span class="k">Centred</span><span class="v" id="centred">–</span></div>
    <div class="stat"><span class="k">km/h</span><span class="v" id="speed">0</span></div>
    <div class="stat"><span class="k">Air</span><span class="v" id="air">0.0</span></div>
    <div class="balance"><span class="k">Balance</span><div class="bar"><i id="balFill"></i></div></div>
    <button class="pause" id="pause" aria-label="Pause"><svg width="14" height="16" viewBox="0 0 14 16" aria-hidden="true"><rect x="1" y="1" width="4" height="14" rx="1" fill="currentColor"/><rect x="9" y="1" width="4" height="14" rx="1" fill="currentColor"/></svg></button>
  </header>

  <div class="stage" id="stage">
    <canvas id="slope" aria-label="Side view of a skier crossing rolling terrain"></canvas>
  </div>

  <section class="controls">
    <div class="meter-row">
      <span class="k">Pressure</span>
      <div class="meter" id="meter"><i id="needle"></i></div>
      <span id="meterWord">–</span>
    </div>
    <div class="meter-ends"><span>tails</span><span>tips</span></div>
    <canvas id="trace" aria-label="Fore-aft balance over the last six seconds"></canvas>
    <div class="slider" id="slider" tabindex="0" role="slider" aria-label="Hips forward or back" aria-valuemin="-30" aria-valuemax="30" aria-valuenow="0">
      <div class="track" id="track">
        <span class="tick" style="left:16.7%"></span><span class="tick" style="left:33.3%"></span>
        <span class="tick" style="left:66.7%"></span><span class="tick" style="left:83.3%"></span>
        <div class="fill" id="fill"></div>
        <span class="notch"></span>
        <div class="thumb" id="thumb" style="left:50%"></div>
      </div>
    </div>
    <div class="slider-labels"><span>Back</span><span id="hipVal">Centred</span><span>Forward</span></div>
  </section>
  <div class="overlay" id="overlay"><div class="card" id="card"></div></div>
</main>

<script>
(function(){
const U_MAX = 30;                // deg: how far the hips can move forward or back of centre
const C1 = 6, C2 = 14, C3 = 26;  // |balance| deg: centred, off-centre, gone (fall)
const FOLLOW = 0.1;              // share of a change in ski pitch the body follows on its own
const RECENTRE = 2.0;            // s: time constant of the body settling back on its own
const G = 9.81, MU = 0.05, VIEW_W = 24, DX = 0.1;
const DRAG = 0.012;              // air drag plus the speed a skier sheds by turning, which this side view doesn't show
const MIN_AIR = 0.2;             // s: shorter than this the skis only skimmed the crest
const HIPS_RATE = 150;           // deg/s: how fast the hips can move on the snow
const AIR_HIPS = 6;              // deg/s: and in the air, with nothing to push against
const SPIN = 1.5;                // deg/s of pitch in the air per degree off centre at takeoff
const ABSORB = 0.3;              // share of a landing's path-to-slope mismatch the legs don't soak up
const TRAILS = {
  // pitch: [distance (m), slope (deg), transition length (m)]; bumps: [start (m), width (m), height (m)], negative is a dip
  green:{name:'Green', len:480,
    pitch:[[0,8],[150,11,30],[260,6,30],[360,9,30]],
    bumps:[[30,22,1.0],[70,22,1.1],[175,22,1.1],[215,22,1.1],[285,22,-1.0],[320,22,1.1],[395,22,1.1],[435,22,1.1]]},
  blue: {name:'Blue', len:540,
    pitch:[[0,11],[120,17,14],[205,9,16],[320,18,12],[420,11,16]],
    bumps:[[35,22,1.6],[74,22,1.8],[150,22,1.8],[190,12,.9],[245,22,-1.7],[282,22,1.8],[350,22,1.9],[392,12,1.0],[455,22,1.8],[492,22,1.9]]},
  black:{name:'Black', len:580,
    pitch:[[0,16],[90,23,10],[170,12,10],[280,24,9],[360,14,10],[470,20,9]],
    bumps:[[30,18,1.4],[62,18,1.6],[190,12,.55],[202,12,.55],[214,12,.55],[226,12,.55],[238,12,.55],[250,12,.55],
           [300,18,-1.8],[380,18,1.9],[412,18,1.9],[490,12,.5],[502,12,.5],[514,12,.5],[526,12,.5],[538,12,.5]]}
};

const $ = id => document.getElementById(id);
const cv = $('slope'), ctx = cv.getContext('2d');
const tc = $('trace'), tctx = tc.getContext('2d');
const overlay = $('overlay'), card = $('card');
const slider = $('slider'), track = $('track'), thumb = $('thumb'), fill = $('fill');

let C = {};
function readColors(){
  const cs = getComputedStyle(document.documentElement);
  ['snow','snow-shade','ink','ink-soft','panel','line','good','warn','bad','cool','sky','ridge','ground','ground-shade','tree','tree-hi','jacket']
    .forEach(k => C[k] = cs.getPropertyValue('--'+k).trim());
  C.zone = [C.good, C.warn, C.bad];
}
readColors();
try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readColors); }catch(e){}

let W=0,H=0,DPR=1,ppm=10,TW=0,TH=0;
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  const r = cv.getBoundingClientRect();
  W = r.width; H = r.height;
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  ppm = W / VIEW_W;
  const tr = tc.getBoundingClientRect();
  TW = tr.width; TH = tr.height;
  tc.width = Math.round(TW*DPR); tc.height = Math.round(TH*DPR);
}
window.addEventListener('resize', resize);

const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
function hash(n){ const x = Math.sin(n*127.1+311.7)*43758.5453; return x - Math.floor(x); }

// ---------- terrain ----------
// height on a 0.1 m grid: the base pitch eases between sections, then cosine bumps sit on top
let TR = null;
function basePitch(T, x){
  const P = T.pitch; let p = P[0][1];
  for (let i=1;i<P.length;i++){
    const w = P[i][2], u = clamp((x - P[i][0] + w/2)/w, 0, 1);
    p += (P[i][1] - P[i-1][1])*u*u*(3-2*u);
  }
  return p;
}
function buildTerrain(T){
  const X0 = -30, n = Math.ceil((T.len + 90 - X0)/DX) + 1, h = new Float64Array(n);
  for (let i=1;i<n;i++) h[i] = h[i-1] - Math.tan(basePitch(T, X0 + (i-.5)*DX)*Math.PI/180)*DX;
  for (const [x0,w,A] of T.bumps){
    for (let i = Math.max(0, Math.floor((x0-X0)/DX)); i <= Math.min(n-1, Math.ceil((x0+w-X0)/DX)); i++){
      const x = X0 + i*DX; if (x >= x0 && x <= x0+w) h[i] += A*(1 - Math.cos(2*Math.PI*(x-x0)/w))/2;
    }
  }
  // th: slope angle, downhill positive. kap: signed curvature, negative over a crest
  const th = new Float64Array(n), kap = new Float64Array(n);
  for (let i=1;i<n-1;i++){
    const d1 = (h[i+1]-h[i-1])/(2*DX), d2 = (h[i+1]-2*h[i]+h[i-1])/(DX*DX);
    th[i] = Math.atan(-d1); kap[i] = d2/Math.pow(1+d1*d1, 1.5);
  }
  th[0] = th[1]; th[n-1] = th[n-2]; kap[0] = kap[1]; kap[n-1] = kap[n-2];
  return { X0, n, h, th, kap };
}
function sample(arr, x){
  const f = (x - TR.X0)/DX, i = clamp(Math.floor(f), 0, TR.n-2), t = clamp(f - i, 0, 1);
  return arr[i]*(1-t) + arr[i+1]*t;
}

// ---------- state ----------
let trailKey = 'blue';
try{ const saved = localStorage.getItem('foreAft.trail'); if (saved && TRAILS[saved]) trailKey = saved; }catch(e){}
const input = { u:0, keyDir:0, fast:false };
let s = null, mode = 'menu', camY = 0;

function newRun(){
  const T = TRAILS[trailKey];
  TR = buildTerrain(T);
  input.u = 0;
  const th0 = sample(TR.th, 0);
  s = { T, x:0, y:sample(TR.h, 0), v:T.name==='Green' ? 9 : T.name==='Blue' ? 12 : 15, skiAng:th0,
        air:false, airStart:0, vx:0, vy:0, d:0, hips:0, phi:0, zone:0, bal:100,
        spin:0, spinAcc:0, takeoffPhi:0, takeoffAng:0, takeoffs:0, cleanTakeoffs:0, takeoffSeen:true, fallTakeoff:false,
        tRun:0, tCentred:0, tBack:0, tFwd:0, airT:0, jumps:0, landT:-1, landPending:false, warned:{},
        trace:[], flash:null, fallT:0, fallDir:0, cause:'', fallBack:false, fallLanded:false, spray:[] };
  camY = 0.65*s.y + 0.35*sample(TR.h, 8);
  const m = $('meter'), pc = v => (50 + v/C3*50)+'%';
  m.style.setProperty('--a1', pc(-C2)); m.style.setProperty('--a2', pc(-C1));
  m.style.setProperty('--a3', pc(C1));  m.style.setProperty('--a4', pc(C2));
}

// ---------- slider input ----------
let drag = null;
slider.addEventListener('pointerdown', e => {
  if (mode==='paused' || drag) return;    // one finger steers: a second one would make the slider jump
  slider.setPointerCapture(e.pointerId);
  drag = { id:e.pointerId, x:e.clientX, v:input.u };
  slider.classList.add('active');
  e.preventDefault();
});
slider.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  const w = track.clientWidth || 1;
  input.u = clamp(drag.v + (e.clientX - drag.x)/w * 2*U_MAX, -U_MAX, U_MAX);
});
const endDrag = e => { if (e && drag && e.pointerId !== drag.id) return; drag = null; slider.classList.remove('active'); };
slider.addEventListener('pointerup', endDrag);
slider.addEventListener('pointercancel', endDrag);
slider.addEventListener('lostpointercapture', endDrag);

window.addEventListener('keydown', e => {
  if ((e.key==='Escape' || e.key==='p' || e.key==='P') && (mode==='run' || mode==='paused')){
    mode==='run' ? pause() : resume(); e.preventDefault(); return;
  }
  if (mode==='paused' && (e.key==='ArrowLeft' || e.key==='ArrowRight')) return;
  if (e.key==='ArrowLeft' || e.key==='ArrowRight'){
    input.keyDir = e.key==='ArrowLeft'? -1 : 1; input.fast = e.shiftKey; e.preventDefault();
  } else if ((e.key===' '||e.key==='Enter') && !overlay.hidden){
    // the card may still hold an earlier screen's buttons while hidden (during a fall), so only a visible one counts
    const b = card.querySelector('.btn'), ae = document.activeElement;
    if (b && !(ae && ae.closest && ae.closest('button, a'))){ b.click(); e.preventDefault(); }
  }
});
window.addEventListener('keyup', e => {
  if (e.key==='ArrowLeft' && input.keyDir===-1) input.keyDir = 0;
  if (e.key==='ArrowRight' && input.keyDir===1) input.keyDir = 0;
  if (e.key==='Shift') input.fast = false;
});

// ---------- simulation ----------
const DEG = 180/Math.PI;
function step(dt){
  if (!(dt > 0)) return;
  const T = s.T;
  if (input.keyDir) input.u = clamp(input.u + input.keyDir*(input.fast? 150:60)*dt, -U_MAX, U_MAX);
  // the hips follow the slider; in the air, with nothing to push against, they barely can
  const hr = (s.air ? AIR_HIPS : HIPS_RATE)*dt;
  s.hips += clamp(input.u - s.hips, -hr, hr);

  if (!s.air){
    const th0 = sample(TR.th, s.x);
    const N = G*Math.cos(th0) + s.v*s.v*sample(TR.kap, s.x);     // what the snow pushes back with, per kg
    if (N < 0){
      // over a crest faster than gravity can bend the path: the skis leave the snow
      s.air = true; s.airStart = s.tRun; s.vx = s.v*Math.cos(th0); s.vy = -s.v*Math.sin(th0); s.skiAng = th0;
      // weight on the tails as the skis leave the snow kicks the tips up, weight on the tips drops them,
      // and nothing in the air stops the rotation: the takeoff decides the landing
      s.takeoffPhi = s.phi; s.takeoffAng = th0; s.spin = clamp(SPIN*s.phi, -40, 40); s.spinAcc = 0; s.takeoffSeen = false;
    } else {
      s.v = clamp(s.v + (G*Math.sin(th0) - MU*N - DRAG*s.v*s.v)*dt, 2, 30);
      s.x += s.v*Math.cos(th0)*dt;
      s.y = sample(TR.h, s.x);
      const th1 = sample(TR.th, s.x);
      // the skis pitch with the snow; the body, by inertia, follows only part of the way
      s.d += (1-FOLLOW)*(th1 - s.skiAng)*DEG;
      s.skiAng = th1;
    }
  }
  if (s.air){
    s.vy -= G*dt; s.x += s.vx*dt; s.y += s.vy*dt; s.airT += dt;
    // a centred skier keeps the skis travelling with the flight path; an off-centre takeoff adds a rotation on top
    s.spinAcc += s.spin*dt;
    s.skiAng = Math.atan2(-s.vy, s.vx) + s.spinAcc/DEG;
    if (!s.takeoffSeen && s.tRun - s.airStart >= MIN_AIR){
      s.takeoffSeen = true; s.takeoffs++;
      const ta = Math.abs(s.takeoffPhi), tz = ta < C1 ? 0 : ta < C2 ? 1 : 2;
      if (tz===0) s.cleanTakeoffs++;
      s.flash = tz===0 ? {text:'Took off centred', t:1, c:C.good} : {text: s.takeoffPhi < 0 ? 'Took off back: tips rising' : 'Took off forward: tips dropping', t:1.4, c:C.zone[tz]};
    }
    const hg = sample(TR.h, s.x);
    if (s.y <= hg){
      // landing: the skis snap to the slope in one go, which shoves the body just as a crest does
      const thl = sample(TR.th, s.x);
      const impact = -(s.vx*Math.sin(thl) + s.vy*Math.cos(thl));
      s.v = clamp(s.vx*Math.cos(thl) - s.vy*Math.sin(thl), 2, 30);
      s.y = hg; s.air = false;
      // after a real flight the legs soak up most of the gap between the flight path and the slope; they can't
      // undo a rotation carried from the takeoff, because the whole body is turning with the skis. A skim barely
      // left the snow, so the slope's change of pitch reaches the body in full, as it does on the snow
      const flew = s.tRun - s.airStart >= MIN_AIR;
      const gap = flew ? ABSORB*(thl - Math.atan2(-s.vy, s.vx)) : thl - s.takeoffAng;
      s.d += (1-FOLLOW)*(gap*DEG - s.spinAcc); s.skiAng = thl;
      if (flew){ s.landT = s.tRun; s.jumps++; s.landPending = true; }
      if (impact > 5) s.bal -= (impact - 5)*12;
      for (let i=0;i<14;i++) s.spray.push({x:s.x + (Math.random()-.5)*1.4, y:s.y, vx:s.v*Math.cos(thl)*.4 + (Math.random()-.5)*3, vy:1 + Math.random()*3, life:.7});
    }
  }

  s.d -= s.d/RECENTRE*dt;
  s.phi = s.hips - s.d;
  const a = Math.abs(s.phi), zone = a < C1 ? 0 : a < C2 ? 1 : 2;
  s.zone = zone;
  if (s.landPending){
    s.landPending = false;
    if (zone > 0) s.bal -= (a - C1)*2.5;   // landing on the tails or the tips is a jolt of its own
    s.flash = zone===0 ? {text:'Landed centred', t:1.2, c:C.good} : {text: s.phi < 0 ? 'Landed back' : 'Landed forward', t:1.2, c:C.zone[zone]};
  }

  // balance drains only with weight on the skis
  if (!s.air){
    if (zone===0) s.bal += 10*dt;
    else if (zone===1) s.bal -= (20 + (a-C1)/(C2-C1)*50)*dt;
    else s.bal -= (150 + (a-C2)*10)*dt;
  }
  s.bal = Math.min(100, s.bal);
  s.tRun += dt;
  if (zone===0) s.tCentred += dt; else if (s.phi < 0) s.tBack += dt; else s.tFwd += dt;

  if (!s.air && (s.bal <= 0 || a > C3)){
    s.fallBack = s.phi < 0; s.fallLanded = s.landT >= 0 && s.tRun - s.landT < 0.8;   // a bad landing usually takes a moment to finish you
    s.fallTakeoff = s.fallLanded && Math.abs(s.takeoffPhi) >= C1 && (s.takeoffPhi < 0) === s.fallBack;
    s.cause = s.fallTakeoff ? (s.fallBack ? 'Took off with your weight back: the tips came up and you landed on your tails.'
                                          : 'Took off with your weight forward: the tips dropped and you landed on them.')
            : s.fallLanded ? (s.fallBack ? 'Landed in the back seat.' : 'Landed on your tips.')
            : (s.fallBack ? 'Back seat: the skis ran out from under you.' : 'Over the tips: the skis slowed and you didn’t.');
    s.bal = 0; mode = 'fall'; s.fallT = 0; s.fallDir = s.fallBack ? -1 : 1;
    for (let i=0;i<22;i++) s.spray.push({x:s.x, y:s.y + .3, vx:s.v*.5 + (Math.random()-.5)*4, vy:Math.random()*4, life:1});
    return;
  }

  s.spray.forEach(p => { p.vy -= G*.5*dt; p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt*1.4; });
  s.spray = s.spray.filter(p => p.life > 0);

  // a change of pitch is announced 30 m before it arrives
  const P = T.pitch;
  for (let i=1;i<P.length;i++){
    const dd = P[i][0] - P[i][2]/2 - s.x;
    if (dd > 0 && dd < 30 && !s.warned[i]){
      s.warned[i] = 1;
      const steeper = P[i][1] > P[i-1][1];
      s.flash = {text: steeper ? 'Rollover ahead' : 'Flattens ahead', t:1.8, c: steeper ? C.warn : C.cool};
    }
  }

  if (s.x >= T.len){ mode = 'done'; return; }
  s.trace.push({t:s.tRun, p:s.phi, z:zone, air:s.air});
  while (s.trace.length && s.tRun - s.trace[0].t > 6) s.trace.shift();
  if (s.flash){ s.flash.t -= dt; if (s.flash.t<=0) s.flash = null; }
}

function stepFall(dt){
  s.fallT += dt;
  if (s.air){
    s.vy -= G*dt; s.x += s.vx*dt; s.y += s.vy*dt;
    const hg = sample(TR.h, s.x); if (s.y <= hg){ s.y = hg; s.air = false; s.v = Math.hypot(s.vx, s.vy)*.5; }
  } else {
    s.v *= Math.exp(-2.2*dt);
    s.x += s.v*Math.cos(s.skiAng)*dt; s.y = sample(TR.h, s.x); s.skiAng = sample(TR.th, s.x);
  }
  s.spray.forEach(p => { p.vy -= G*.5*dt; p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt*0.9; });
  if (s.fallT > 1.4 && mode==='fall'){ mode = 'fallen'; showFall(); }
}

// ---------- drawing ----------
const camX = () => W*0.24, camYs = () => H*0.4;
const toS = (x,y) => [camX() + (x - s.x)*ppm, camYs() - (y - camY)*ppm];

function draw(){
  const T = s.T;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle = C.sky; ctx.fillRect(0,0,W,H);

  // distant ridge, moving at a fifth of the skier's pace
  ctx.fillStyle = C.ridge; ctx.beginPath(); ctx.moveTo(0,H);
  for (let sx = 0; sx <= W+6; sx += 6){
    const wx = (s.x*ppm*0.2 + sx)/ppm;
    const ry = H*0.30 + Math.sin(wx*0.11)*22 + Math.sin(wx*0.047+1.3)*30 + Math.sin(wx*0.23+.4)*8 + (camY - s.y)*ppm*0.05;
    ctx.lineTo(sx, ry);
  }
  ctx.lineTo(W,H); ctx.closePath(); ctx.fill();

  // trees standing on the slope
  const xL = s.x - camX()/ppm - 4, xR = s.x + (W - camX())/ppm + 4;
  for (let i = Math.floor(xL/7); i <= Math.ceil(xR/7); i++){
    if (hash(i*1.7) < 0.55) continue;
    const tx = i*7 + hash(i*3.3)*4, ht = 3 + hash(i*5.1)*3.5;
    const [bx, by] = toS(tx, sample(TR.h, tx) - 0.3);
    ctx.fillStyle = C.tree;
    ctx.beginPath(); ctx.moveTo(bx, by - ht*ppm); ctx.lineTo(bx - ht*.32*ppm, by); ctx.lineTo(bx + ht*.32*ppm, by); ctx.closePath(); ctx.fill();
    ctx.fillStyle = C['tree-hi'];
    ctx.beginPath(); ctx.moveTo(bx, by - ht*ppm); ctx.lineTo(bx - ht*.12*ppm, by - ht*.45*ppm); ctx.lineTo(bx + ht*.05*ppm, by - ht*.5*ppm); ctx.closePath(); ctx.fill();
  }

  // the snow: surface line and the ground below it
  const surf = [];
  for (let sx = -3; sx <= W+3; sx += 3){ const wx = s.x + (sx - camX())/ppm; surf.push([sx, toS(wx, sample(TR.h, wx))[1]]); }
  const g = ctx.createLinearGradient(0, camYs() - 40, 0, H);
  g.addColorStop(0, C.ground); g.addColorStop(1, C['ground-shade']);
  ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(-3, H);
  for (const [x,y] of surf) ctx.lineTo(x, y);
  ctx.lineTo(W+3, H); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = C['ink-soft']; ctx.lineWidth = 2; ctx.lineJoin = 'round';
  ctx.beginPath(); surf.forEach(([x,y], i) => i ? ctx.lineTo(x,y) : ctx.moveTo(x,y)); ctx.stroke();

  // finish banner
  if (T.len < xR){
    const [fx, fy] = toS(T.len, sample(TR.h, T.len)), ph = 2.6*ppm, sq = 6;
    ctx.fillStyle = C.ink; ctx.fillRect(fx-1.5, fy - ph, 3, ph);
    for (let r=0;r<3;r++) for (let c=0;c<5;c++){ ctx.fillStyle = (r+c)%2 ? C.ink : C.panel; ctx.fillRect(fx + 1.5 + c*sq, fy - ph + r*sq, sq, sq); }
  }

  for (const p of s.spray){ const [px,py] = toS(p.x,p.y); ctx.globalAlpha = Math.max(0, Math.min(1,p.life)); ctx.fillStyle = C['ink-soft']; ctx.beginPath(); ctx.arc(px,py,2,0,Math.PI*2); ctx.fill(); }
  ctx.globalAlpha = 1;

  drawSkier();

  if (s.flash){
    ctx.globalAlpha = Math.min(1, s.flash.t*2);
    ctx.font = '700 22px "Barlow Condensed", sans-serif'; ctx.textAlign = 'center';
    ctx.fillStyle = s.flash.c; ctx.fillText(s.flash.text, W/2, 34);
    ctx.globalAlpha = 1;
  }
}

// side view, facing right. Drawn in the skis' frame: x along the skis, y down the screen
function drawSkier(){
  const [sx, sy] = toS(s.x, s.y), k = ppm*2.2;          // larger than life, so the lean reads at a glance
  const falling = mode==='fall' || mode==='fallen';
  const p = clamp(s.phi, -40, 40)/DEG;
  const P = (x, y) => [x*k, y*k];
  ctx.save(); ctx.translate(sx, sy); ctx.rotate(s.skiAng);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';

  // where centred is: straight up from the boots, square to the skis
  if (!falling){
    ctx.strokeStyle = C['ink-soft']; ctx.lineWidth = 1.5; ctx.setLineDash([3,4]);
    ctx.beginPath(); ctx.moveTo(...P(0,-0.1)); ctx.lineTo(...P(0,-1.75)); ctx.stroke(); ctx.setLineDash([]);
  }
  // skis, with a turned-up tip
  ctx.strokeStyle = C.ink; ctx.lineWidth = Math.max(2.5, k*0.07);
  ctx.beginPath(); ctx.moveTo(...P(-0.85,0)); ctx.lineTo(...P(0.72,0)); ctx.quadraticCurveTo(...P(0.9,0), ...P(0.96,-0.1)); ctx.stroke();

  // the body pivots about the boots when it falls
  if (falling) ctx.rotate(s.fallDir*clamp(s.fallT*2.2, 0, 1.35));
  // proportions of a flexed stance: legs longer than the torso. Moving fore-aft is mostly the hips
  // travelling over the feet, with the shins flexing; the torso tips only a little further
  const ank = [0, -0.12];
  const cm = [Math.sin(p)*0.95, -0.12 - Math.cos(p)*0.85];   // centre of mass ahead of (+) or behind (-) the boots
  const hip = [cm[0] - 0.08, cm[1] + 0.06];
  const legLen = Math.hypot(hip[0]-ank[0], hip[1]-ank[1]), bend = Math.sqrt(Math.max(0, 0.47*0.47 - legLen*legLen/4));
  const ux = (hip[0]-ank[0])/legLen, uy = (hip[1]-ank[1])/legLen;
  const knee = [(ank[0]+hip[0])/2 - uy*bend, (ank[1]+hip[1])/2 + ux*bend];   // two 0.47 m segments, knee bent forward
  const tl = 0.32 + 0.45*p, sh = [hip[0] + Math.sin(tl)*0.55, hip[1] - Math.cos(tl)*0.55];
  const head = [sh[0] + Math.sin(tl-0.1)*0.2, sh[1] - Math.cos(tl-0.1)*0.2];
  const hand = [sh[0] + 0.3, sh[1] + 0.26];
  const lw = Math.max(3, k*0.1);
  ctx.strokeStyle = C.ink; ctx.lineWidth = Math.max(1, k*0.025);
  ctx.beginPath(); ctx.moveTo(...P(...hand)); ctx.lineTo(...P(hand[0]-0.45, 0)); ctx.stroke();            // pole
  ctx.lineWidth = lw;
  ctx.beginPath(); ctx.moveTo(...P(...ank)); ctx.lineTo(...P(...knee)); ctx.lineTo(...P(...hip)); ctx.stroke();  // leg
  ctx.fillStyle = C.ink; ctx.fillRect(...P(-0.13,-0.22), 0.3*k, 0.2*k);                                       // boot
  ctx.strokeStyle = C.jacket; ctx.lineWidth = lw*1.5;
  ctx.beginPath(); ctx.moveTo(...P(...hip)); ctx.lineTo(...P(...sh)); ctx.stroke();                          // torso
  ctx.lineWidth = lw*0.8;
  ctx.beginPath(); ctx.moveTo(...P(...sh)); ctx.lineTo(...P(...hand)); ctx.stroke();                         // arm
  ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(...P(...head), 0.12*k, 0, Math.PI*2); ctx.fill();          // head
  if (!falling){
    ctx.fillStyle = s.air ? C['ink-soft'] : C.zone[s.zone]; ctx.strokeStyle = C.panel; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(...P(...cm), Math.max(4, 0.08*k), 0, Math.PI*2); ctx.fill(); ctx.stroke();
  }
  ctx.restore();
}

function drawTrace(){
  tctx.setTransform(DPR,0,0,DPR,0,0);
  tctx.clearRect(0,0,TW,TH);
  const pad = 4, mid = TH/2, amp = TH/2 - pad, x0 = 40, yOf = p => mid - clamp(p/C3, -1, 1)*amp;
  tctx.fillStyle = C.good; tctx.globalAlpha = .14; tctx.fillRect(x0, yOf(C1), TW-x0, yOf(-C1) - yOf(C1)); tctx.globalAlpha = 1;
  tctx.strokeStyle = C.line; tctx.lineWidth = 1; tctx.setLineDash([3,4]);
  tctx.beginPath(); tctx.moveTo(x0, mid+.5); tctx.lineTo(TW, mid+.5); tctx.stroke(); tctx.setLineDash([]);
  tctx.font = '500 11px Barlow, sans-serif'; tctx.fillStyle = C['ink-soft']; tctx.textAlign = 'left';
  tctx.fillText('tips', 2, 11); tctx.fillText('centre', 2, mid+4); tctx.fillText('tails', 2, TH-3);
  if (!s || s.trace.length < 2) return;
  const tEnd = s.tRun;
  tctx.lineWidth = 2.5; tctx.lineCap = 'round';
  for (let i=1;i<s.trace.length;i++){
    const a = s.trace[i-1], b = s.trace[i];
    const xa = x0 + (1 - (tEnd-a.t)/6)*(TW-x0), xb = x0 + (1 - (tEnd-b.t)/6)*(TW-x0);
    tctx.strokeStyle = b.air ? C['ink-soft'] : C.zone[b.z];
    tctx.beginPath(); tctx.moveTo(xa, yOf(a.p)); tctx.lineTo(xb, yOf(b.p)); tctx.stroke();
  }
}

const WORDS = { c:'centred', b:'back', f:'forward', bb:'back seat', ff:'on the tips' };
function updateUI(){
  $('pause').style.visibility = mode==='run' ? 'visible' : 'hidden';
  $('centred').textContent = s.tRun > 0.5 ? Math.round(s.tCentred/s.tRun*100)+'%' : '–';
  $('speed').textContent = Math.round(s.v*3.6);
  $('air').textContent = s.airT.toFixed(1);
  const bf = $('balFill'); bf.style.width = Math.max(0,s.bal)+'%';
  bf.style.backgroundColor = s.bal > 60 ? C.good : s.bal > 30 ? C.warn : C.bad;
  $('needle').style.left = (50 + clamp(s.phi/C3, -1, 1)*50)+'%';
  const mw = $('meterWord');
  if (s.air){ mw.textContent = 'in the air'; mw.style.color = C['ink-soft']; }
  else {
    mw.textContent = s.zone===0 ? WORDS.c : s.phi < 0 ? (s.zone===2 ? WORDS.bb : WORDS.b) : (s.zone===2 ? WORDS.ff : WORDS.f);
    mw.style.color = C.zone[s.zone];
  }
  const pct = (input.u + U_MAX)/(2*U_MAX)*100;
  thumb.style.left = pct+'%';
  fill.style.left = Math.min(50,pct)+'%'; fill.style.width = Math.abs(pct-50)+'%';
  const au = Math.round(Math.abs(input.u));
  $('hipVal').textContent = au < 2 ? 'Centred' : au+'° '+(input.u<0?'back':'forward');
  slider.setAttribute('aria-valuenow', Math.round(input.u));
}

// ---------- screens ----------
function bestText(){
  try{
    const b = JSON.parse(localStorage.getItem('foreAft.best.'+trailKey) || 'null');
    return b ? `Best on ${TRAILS[trailKey].name}: ${b.centred}% centred` : '';
  }catch(e){ return ''; }
}
function saveBest(centred){
  try{
    const key = 'foreAft.best.'+trailKey;
    const b = JSON.parse(localStorage.getItem(key) || 'null');
    if (!b || centred > b.centred){ localStorage.setItem(key, JSON.stringify({centred})); return true; }
  }catch(e){}
  return false;
}
function chipsHTML(){
  return '<div class="chips" role="group" aria-label="Trail">' + Object.entries(TRAILS).map(([k,t]) =>
    `<button class="chip" data-k="${k}" aria-pressed="${k===trailKey}"><span class="dot ${k}"></span>${t.name}</button>`).join('') + '</div>';
}
function wireChips(){
  card.querySelectorAll('.chip').forEach(b => b.onclick = () => {
    trailKey = b.dataset.k; try{ localStorage.setItem('foreAft.trail', trailKey); }catch(e){}
    card.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c===b));
    const be = card.querySelector('.best'); if (be) be.textContent = bestText();
    newRun();
  });
}
function showMenu(){
  mode = 'menu'; newRun();
  card.innerHTML = `
    <a class="back" href="../">← All games</a>
    <h1>Fore-aft</h1>
    <p class="src">Stay centred over your feet as the terrain changes.</p>
    <p>Drag the slider to move your hips forward or back over your skis. As the slope drops away over a crest, move forward with your skis. As it flattens or rises into a dip, let your feet come forward.</p>
    <p style="font-size:14px;color:var(--ink-soft)">The dashed line from the boots is centred; the dot is your centre of mass. Fast over a crest you’ll fly, and in the air you can barely move: leave the snow on your tails and the tips rise, on your tips and they drop. Take off centred to land centred.</p>
    ${chipsHTML()}
    <div class="best">${bestText()}</div>
    <button class="btn" id="go">Start run</button>`;
  wireChips();
  $('go').onclick = start;
  overlay.hidden = false;
}
function start(){ newRun(); overlay.hidden = true; mode = 'run'; slider.focus({preventScroll:true}); last = performance.now(); }
function results(title, lead){
  const centred = s.tRun > 0 ? Math.round(s.tCentred/s.tRun*100) : 0;
  const rec = mode==='done' && saveBest(centred);
  card.innerHTML = `
    <a class="back" href="../">← All games</a>
    <h2>${title}</h2>
    ${lead}
    <div class="statsline">
      <div><b>${centred}%</b>centred</div>
      <div><b>${Math.round(Math.min(s.x, s.T.len)/s.T.len*100)}%</b>of the run</div>
      <div><b>${s.takeoffs ? s.cleanTakeoffs+'/'+s.takeoffs : '–'}</b>takeoffs centred</div>
    </div>
    <div class="best">${rec ? 'New best on '+s.T.name : bestText()}</div>
    <button class="btn" id="again">Ski again</button>
    <button class="btn ghost" id="menu">Change trail</button>`;
  $('again').onclick = start; $('menu').onclick = showMenu;
  overlay.hidden = false;
}
function showFall(){
  const advice = s.fallTakeoff
    ? 'In the air there is nothing to push against, so you can’t fix it there. Be centred as the skis leave the snow.'
    : s.fallLanded
    ? (s.fallBack ? 'The landing was steeper than your skis. Take off centred, even a touch forward, so the tips drop with the slope.'
                  : 'The landing was flatter than your skis. Take off centred, and let your feet come forward as you land.')
    : (s.fallBack ? 'As the slope drops away over a crest, move forward with your skis, starting before the tips drop.'
                  : 'As the slope flattens or rises into a dip, let your feet come forward so the tips don’t stop you.');
  results('Fell', `<p class="cause">${s.cause}</p><p>${advice}</p>`);
}
function showDone(){
  const centred = s.tRun > 0 ? s.tCentred/s.tRun : 0;
  const lead = centred >= 0.75 ? 'Centred over your feet through the terrain.'
    : s.tBack > s.tFwd ? 'Mostly back. Move forward as the slope drops away, before the tips drop.'
    : 'Mostly forward. Let your feet come forward as the slope flattens into a dip.';
  const off = s.takeoffs - s.cleanTakeoffs;
  const air = off ? ` ${off===1 ? 'One takeoff was' : off+' takeoffs were'} off centre, and the air carried it into the landing. Be centred as the skis leave the snow.` : '';
  results('Run complete', `<p>${lead}${air}</p>`);
}

function pause(){
  if (mode!=='run') return;
  mode = 'paused'; input.keyDir = 0; endDrag();
  card.innerHTML = `
    <a class="back" href="../">← All games</a>
    <h2>Paused</h2>
    <p>${Math.round(s.tCentred/Math.max(s.tRun,1e-9)*100) + '% centred so far, ' + Math.round(s.x/s.T.len*100) + '% of the way down.'}</p>
    <button class="btn" id="resume">Resume</button>
    <button class="btn ghost" id="restart">Restart run</button>
    <button class="btn ghost" id="menu">Change trail</button>`;
  $('resume').onclick = resume; $('restart').onclick = start; $('menu').onclick = showMenu;
  overlay.hidden = false;
  $('resume').focus({preventScroll:true});
}
// the control is locked while paused, so the run picks up exactly where it stopped
function resume(){ overlay.hidden = true; mode = 'run'; slider.focus({preventScroll:true}); last = performance.now(); }
$('pause').onclick = pause;
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

// ---------- loop ----------
let last = performance.now();
function frame(now){
  let dt = (now - last)/1000; last = now;
  // a frame stamped at or before the last one (a start or resume lands mid-frame) moves nothing
  dt = clamp(dt, 0, 1/30);
  if (dt > 0){
    if (mode==='run'){ step(dt); if (mode==='done') showDone(); }
    else if (mode==='fall' || mode==='fallen') stepFall(dt);
    // the camera eases after the skier, so bumps don't jolt it, and leans toward the snow ahead
    camY += (0.65*s.y + 0.35*sample(TR.h, s.x + 8) - camY)*(1 - Math.exp(-dt/0.25));
  }
  draw(); drawTrace(); updateUI();
  requestAnimationFrame(frame);
}
resize();
showMenu();
requestAnimationFrame(t => { last = t; frame(t); });
})();
</script>
</body>
</html>
